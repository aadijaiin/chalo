name: Keep Supabase awake

# Supabase's free plan pauses a project after a stretch without activity, and a paused backend
# means nobody's map updates. A daily read through the public API counts as activity. If the
# call fails (say the project was paused anyway), the run fails and GitHub emails you.
#
# Needs the SUPABASE_URL and SUPABASE_KEY repository secrets (the same public values as
# app/.env). GitHub turns scheduled workflows off after 60 days without commits; if that
# happens, re-enable it from the Actions tab.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Add the SUPABASE_URL and SUPABASE_KEY repository secrets."
            exit 1
          fi
          # watch_party with a token that matches nothing: a real query, no data returned.
          code=$(curl -sS -o /tmp/body -w '%{http_code}' --retry 3 --retry-delay 10 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/watch_party" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
            -H 'Content-Type: application/json' -d '{"token":"keepalive"}')
          echo "HTTP $code: $(cat /tmp/body)"
          [ "$code" = "200" ]
