name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  web:
    name: Website lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build

  privacy:
    name: Privacy tests
    # They run against the real Supabase project with throwaway accounts, so only on main (and by
    # hand), and only once the repo has the project's URL and publishable key as secrets.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run
        if: env.SUPABASE_URL != '' && env.SUPABASE_KEY != ''
        run: node --test backend/tests/*.test.mjs
      - name: Skipped
        if: env.SUPABASE_URL == '' || env.SUPABASE_KEY == ''
        run: echo "::notice::Add SUPABASE_URL and SUPABASE_KEY repository secrets to run the privacy tests."
